      <stop stop-color="#E3EEFF"/>
      <stop offset="1" stop-color="#DDF3ED"/>
    </linearGradient>
    <linearGradient id="lineH" x1="34" y1="104" x2="143" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F70C8"/>
      <stop offset="0.55" stop-color="#5366D8"/>
