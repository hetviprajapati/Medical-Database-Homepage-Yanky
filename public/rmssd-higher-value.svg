  <!-- trend points -->
  <circle cx="57" cy="89" r="4.5" fill="#2F70C8"/>
  <circle cx="76" cy="81" r="4.5" fill="#5366D8"/>
  <circle cx="97" cy="72" r="4.5" fill="#5366D8"/>
  <circle cx="119" cy="62" r="4.5" fill="#24AFA0"/>
  <circle cx="145" cy="43" r="5" fill="#19AE99"/>

