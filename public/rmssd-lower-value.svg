      <stop stop-color="#E9EDFF"/>
      <stop offset="1" stop-color="#E4F0F2"/>
    </linearGradient>
    <linearGradient id="lineL" x1="35" y1="43" x2="145" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5366D8"/>
      <stop offset="0.55" stop-color="#456BBE"/>
