  <!-- trend points -->
  <circle cx="58" cy="55" r="4.5" fill="#5366D8"/>
  <circle cx="78" cy="63" r="4.5" fill="#5366D8"/>
  <circle cx="99" cy="72" r="4.5" fill="#456BBE"/>
  <circle cx="121" cy="83" r="4.5" fill="#258FA0"/>
  <circle cx="145" cy="98" r="5" fill="#1A9D91"/>

  <!-- downward arrow -->
